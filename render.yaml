services:
  - type: web
    name: cyberguardianes-aula
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AZURE_SQL_SERVER
        sync: false
      - key: AZURE_SQL_DATABASE
        sync: false
      - key: AZURE_SQL_USER
        sync: false
      - key: AZURE_SQL_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLASS_CODE
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
